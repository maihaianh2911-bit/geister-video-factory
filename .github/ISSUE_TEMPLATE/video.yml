name: 🎬 Yêu cầu video mới
description: Đã có kịch bản tiếng Đức? Dán vào, bấm Create — máy làm video.
title: "[Video] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ### Chỉ cần 2 bước
        1. **Tiêu đề:** gõ tên video sau chữ `[Video]` (xóa mất chữ đó cũng không sao).
        2. **Dán kịch bản tiếng Đức** vào ô bên dưới → bấm **Create**.

        Các ô còn lại đều không bắt buộc. Chưa có tiếng Đức, chỉ có tiếng Việt? → dùng mẫu **🇻🇳 Kịch bản tiếng Việt → video Đức**.
  - type: textarea
    id: de
    attributes:
      label: Kịch bản tiếng Đức
      description: Dán nguyên văn. Mỗi câu (hoặc 2 câu) một dòng. Máy đọc đúng từng chữ, không sửa gì.
      placeholder: |
        Stell dir vor, du wachst eines Morgens auf …
        Zuerst glaubst du, dass du träumst.
        …
    validations:
      required: true
  - type: textarea
    id: vi
    attributes:
      label: Bản dịch tiếng Việt (không bắt buộc)
      description: Để bạn đối chiếu trên storyboard. Bỏ trống cũng được.
  - type: dropdown
    id: voice
    attributes:
      label: Giọng đọc
      options:
        - Giọng mặc định (clone "nữ- đức", clone_113)
        - Giọng clone "nam- đức" (clone_112)
        - Giọng khác (ghi voice_id ở ô Ghi chú)
        - Tôi tự đính kèm MP3 bên dưới
      default: 0
  - type: textarea
    id: notes
    attributes:
      label: Ghi chú hình ảnh (không bắt buộc)
      description: Ví dụ "phong cách người que", "nhân vật chính là một con mèo", "cảnh cuối ở bãi biển".
  - type: markdown
    attributes:
      value: "---\n**Nâng cao — bỏ qua nếu không cần**"
  - type: textarea
    id: style_images
    attributes:
      label: Ảnh mẫu phong cách (không bắt buộc)
      description: Kéo thả 1–3 ảnh (màu sắc, cách vẽ, không khí chung).
  - type: textarea
    id: ref_video
    attributes:
      label: Video mẫu (không bắt buộc)
      description: Kéo thả 1 file MP4 có phong cách/nhịp dựng bạn muốn. Máy học theo tinh thần, không sao chép nhân vật/logo.
  - type: textarea
    id: scene_images
    attributes:
      label: Ảnh mẫu theo cảnh (không bắt buộc)
      description: Ghi "Cảnh 3:" rồi kéo thả ảnh bố cục ngay bên dưới.
  - type: textarea
    id: own_audio
    attributes:
      label: File MP3 của bạn (chỉ khi chọn "tự đính kèm")
      description: Kéo thả file MP3 (và SRT nếu có) vào đây.
