name: Kiểm tra duyệt từng cảnh
on:
  pull_request:
  push:
    branches: [main, codex/review-render-cache]
permissions:
  contents: read
jobs:
  review-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Cài dependencies
        run: npm ci --no-audit --no-fund
      - name: Kiểm tra báo cáo thiếu, lỗi và hết hiệu lực
        run: |
          python3 -m unittest discover -s tests -v
          node --check scripts/local_stills.cjs
          python3 -m compileall -q scripts
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Cài bộ dựng
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libxrandr2 libxcomposite1 libxdamage1 libxfixes3 libpango-1.0-0 libcairo2 libcups2 libasound2t64
          npx remotion browser ensure
      - name: Dựng chuỗi ảnh hai cảnh thử (không gọi API)
        run: |
          python3 tests/create_review_fixture.py
          python3 scripts/gen_registry.py --only review-smoke
          npm run check
          node scripts/validate_scene.mjs review-smoke
          python3 tests/check_review_cache.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: per-scene-review-smoke
          path: jobs/review-smoke/
          retention-days: 7

