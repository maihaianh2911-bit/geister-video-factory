name: Render video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Remotion composition id
        default: Geister
        required: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: System libraries for headless Chrome + ffmpeg for QA
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libxrandr2 libxcomposite1 libxdamage1 libxfixes3 libpango-1.0-0 libcairo2 libcups2 || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Render
        run: |
          mkdir -p out
          npx remotion browser ensure
          npx remotion render ${{ inputs.composition }} out/video.mp4 --concurrency=4 --log=info

      - name: QA
        run: |
          chmod +x scripts/qa.sh
          scripts/qa.sh out/video.mp4 2640

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}-render
          path: |
            out/video.mp4
            out/contact_sheet.jpg
            out/qa_*.txt
          retention-days: 14
