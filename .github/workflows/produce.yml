name: Sản xuất video (giọng + âm thanh + dựng)

on:
  workflow_dispatch:
    inputs:
      video:
        description: Mã video (thư mục trong src/videos, vd geister hoặc v12)
        default: geister
        required: true
      issue:
        description: Số phiếu để báo kết quả (để trống nếu chạy tay)
        default: ''
      regenerate_voice:
        description: Tạo lại giọng đọc (tốn ký tự 11labs)
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: produce-${{ inputs.video }}
  cancel-in-progress: false

env:
  V: ${{ inputs.video }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: faster-whisper-small-v1 }
      - name: Cài công cụ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libxrandr2 libxcomposite1 libxdamage1 libxfixes3 libpango-1.0-0 libcairo2 libcups2 || true
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2 || true
          pip install -q faster-whisper==1.1.1 requests numpy scipy soundfile pyloudnorm

      - name: Giọng đọc (dùng lại nếu đã có)
        shell: bash
        env:
          VN11_API_KEY: ${{ secrets.VN11_API_KEY }}
          VN11_VOICE_ID: ${{ secrets.VN11_VOICE_ID }}
        run: |
          set -euo pipefail
          mkdir -p "assets/$V"
          if [ -f "assets/$V/voice.mp3" ] && [ "${{ inputs.regenerate_voice }}" != "true" ]; then
            echo "Dùng lại assets/$V/voice.mp3 (không tốn ký tự)"
          else
            VOICE=$(python3 -c "import json,os;p='jobs/$V/job.json';print(json.load(open(p))['voice'] if os.path.exists(p) else '')")
            python3 -c "import json;print(' '.join(l[2] for l in json.load(open('src/videos/$V/lines.json',encoding='utf-8'))))" > /tmp/script_de.txt
            python3 scripts/vn11.py tts --text-file /tmp/script_de.txt --out /tmp/voice --voice "$VOICE"
            cp /tmp/voice/voice.mp3 "assets/$V/voice.mp3"; cp /tmp/voice/usage.json "assets/$V/voice_usage.json"
            echo "::notice title=voice usage::$(tr -d '\n' < assets/$V/voice_usage.json)"
          fi

      - name: Căn từng từ (chỉ khi giọng thay đổi)
        shell: bash
        run: |
          set -o pipefail
          SHA=$(sha1sum "assets/$V/voice.mp3" | cut -c1-12)
          OLD=$(python3 -c "import json;print(json.load(open('src/videos/$V/timing.json')).get('voice_sha',''))" 2>/dev/null || echo "")
          if [ "$SHA" = "$OLD" ]; then echo "timing đã khớp giọng hiện tại ($SHA) — bỏ qua Whisper"; exit 0; fi
          cp "src/videos/$V/timing.json" /tmp/old_timing.json 2>/dev/null || true
          EXTRA=""
          if [ -f "jobs/$V/job.json" ] && [ -f /tmp/old_timing.json ] && [ -f "src/videos/$V/scene.js" ]; then EXTRA="--orig-from /tmp/old_timing.json"; fi
          if [ -f "jobs/$V/job.json" ] && [ ! -f "src/videos/$V/scene.js" ]; then EXTRA="--identity"; fi
          python3 scripts/align.py --audio "assets/$V/voice.mp3" --lines "src/videos/$V/lines.json" --out "src/videos/$V/timing.json" $EXTRA 2>&1 | tee /tmp/align.txt
          echo "::notice title=alignment::$(tail -n 1 /tmp/align.txt)"

      - name: Lưu giọng + timing vào kho
        env: { GH_TOKEN: '${{ github.token }}' }
        run: scripts/git_push.sh "[$V] voice + word timing ($GITHUB_RUN_ID)" "assets/$V" "src/videos/$V/timing.json"

      - name: Âm thanh (kho CC0 + âm thanh riêng + nhạc nền, trộn)
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          mkdir -p out "public/$V"
          scripts/audio.sh "$V" "public/$V/mix.m4a"

      - name: Cài Remotion
        run: |
          python3 scripts/gen_registry.py --only "$V"
          npm ci --no-audit --no-fund && npx tsc --noEmit

      - name: Dựng
        shell: bash
        run: |
          set -o pipefail
          C=$(python3 -c "import sys;sys.path.insert(0,'scripts');from gen_registry import comp_id;print(comp_id('$V'))")
          npx remotion browser ensure
          npx remotion render "$C" out/video.mp4 --props="{\"video\":\"$V\",\"audio\":\"$V/mix.m4a\"}" --concurrency=4 --log=info 2>&1 | tee out/render.log
          test -s out/video.mp4
          ffmpeg -v error -y -i out/video.mp4 -vf "scale=in_range=full:out_range=tv,format=yuv420p" -c:v libx264 -preset veryfast -crf 18 -c:a copy -movflags +faststart out/final.mp4
          mv out/final.mp4 out/video.mp4

      - name: QA
        shell: bash
        run: |
          set -o pipefail
          EXP=$(python3 -c "import json,math;print(math.ceil(json.load(open('src/videos/$V/timing.json'))['duration']*30))")
          scripts/qa.sh out/video.mp4 "$EXP" 2>&1 | tee out/qa.log
          ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 out/video.mp4 | grep -q aac || { echo "FAIL không có audio"; exit 1; }
          MV=$(ffmpeg -i out/video.mp4 -af volumedetect -f null - 2>&1 | grep -o "mean_volume: [-0-9.]*" | grep -o "[-0-9.]*$")
          echo "mean_volume=$MV" | tee -a out/qa.log
          python3 -c "import sys; sys.exit(0 if float('$MV') > -35 else 1)" || { echo "FAIL audio quá nhỏ"; exit 1; }

      - name: Surface logs on failure
        if: failure()
        shell: bash
        run: |
          for f in out/render.log out/qa.log /tmp/align.txt; do
            [ -f "$f" ] || continue
            MSG=$(tail -n 50 "$f" | sed 's/\x1b\[[0-9;]*m//g' | sed 's/%/%25/g' | tr '\n' '~' | tail -c 3500 | sed 's/~/%0A/g')
            echo "::error title=$f::$MSG"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.video }}-produce
          path: |
            out/video.mp4
            out/contact_sheet.jpg
            out/qa.log
            out/render.log
          retention-days: 14

      - name: Đưa lên nhánh renders
        if: success()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p /tmp/pub
          cp out/video.mp4 "/tmp/pub/$V-final.mp4"; cp out/contact_sheet.jpg "/tmp/pub/$V-final-contact_sheet.jpg"; cp out/qa.log "/tmp/pub/$V-final-qa.log"
          cp "src/videos/$V/timing.json" "/tmp/pub/$V-timing.json"
          [ -f "out/audio/$V/CREDITS.md" ] && cp "out/audio/$V/CREDITS.md" "/tmp/pub/$V-sound-credits.md" || true
          scripts/publish_renders.sh . /tmp/pub/*

      - name: Báo vào phiếu
        if: always() && inputs.issue != ''
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          N='${{ inputs.issue }}'
          if [ "${{ job.status }}" = "success" ]; then
            DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/video.mp4 | cut -c1-5)
            {
              echo "✅ **Video hoàn chỉnh đã xong** — [tải MP4](https://github.com/${GITHUB_REPOSITORY}/blob/renders/$V-final.mp4) (bấm vào, rồi bấm nút tải ⬇ ở góc phải)"
              echo
              echo "${DUR}s · 1080×1920 · 30 FPS · đã qua kiểm tra tự động · [ảnh tóm tắt khung hình](https://github.com/${GITHUB_REPOSITORY}/blob/renders/$V-final-contact_sheet.jpg)"
              echo
              echo "Muốn chỉnh âm lượng: sửa \`src/videos/$V/mix.json\` rồi chạy lại **Actions → Sản xuất video** với mã \`$V\`."
            } > /tmp/c.md
            gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body-file /tmp/c.md
            gh issue edit "$N" --repo "$GITHUB_REPOSITORY" --add-label done --remove-label visual-ok --remove-label preview-ready || true
          else
            gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body "❌ Dựng bản hoàn chỉnh bị lỗi. Log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue edit "$N" --repo "$GITHUB_REPOSITORY" --add-label failed || true
          fi
