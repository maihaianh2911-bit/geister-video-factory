name: Sản xuất video (giọng + âm thanh + dựng)

on:
  workflow_dispatch:
    inputs:
      video:
        description: Tên video (thư mục trong src/videos)
        default: geister
        required: true
      regenerate_voice:
        description: Tạo lại giọng đọc (tốn ký tự 11labs)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: produce-${{ inputs.video }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VN11_API_KEY: ${{ secrets.VN11_API_KEY }}
      VN11_VOICE_ID: ${{ secrets.VN11_VOICE_ID }}
      V: ${{ inputs.video }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libxrandr2 libxcomposite1 libxdamage1 libxfixes3 libpango-1.0-0 libcairo2 libcups2 || true
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2 || true

      - name: Python packages
        run: pip install -q faster-whisper==1.1.1 numpy scipy

      - name: Giọng đọc (dùng lại nếu đã có)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "assets/$V"
          if [ -f "assets/$V/voice.mp3" ] && [ "${{ inputs.regenerate_voice }}" != "true" ]; then
            echo "Dùng lại assets/$V/voice.mp3 (không tốn ký tự)"
          else
            python3 -c "import json;print(' '.join(l[2] for l in json.load(open('src/videos/$V/lines.json',encoding='utf-8'))))" > /tmp/script_de.txt
            python3 scripts/vn11.py tts --text-file /tmp/script_de.txt --out /tmp/voice
            cp /tmp/voice/voice.mp3 "assets/$V/voice.mp3"
            cp /tmp/voice/usage.json "assets/$V/voice_usage.json"
            [ -f /tmp/voice/voice.srt ] && cp /tmp/voice/voice.srt "assets/$V/voice.srt" || true
            echo "::notice title=voice usage::$(tr -d '\n' < assets/$V/voice_usage.json)"
          fi
          ffprobe -v error -show_entries format=duration -of default=nw=1 "assets/$V/voice.mp3"

      - name: Căn thời gian từng từ (Whisper)
        run: |
          python3 scripts/align.py --audio "assets/$V/voice.mp3" --lines "src/videos/$V/lines.json" --out "src/videos/$V/timing.json" --model small | tee /tmp/align.txt
          echo "::notice title=alignment::$(cat /tmp/align.txt)"

      - name: Lưu giọng + timing vào kho (lần sau khỏi tạo lại)
        run: |
          git config user.name render-bot; git config user.email render-bot@users.noreply.github.com
          git add "assets/$V" "src/videos/$V/timing.json"
          git commit -q -m "[$V] voice + word timing ($GITHUB_RUN_ID)" || echo "không có gì mới"
          git push origin HEAD:main || echo "::warning::không đẩy được giọng/timing lên main"

      - name: Âm thanh (tổng hợp + trộn, tự hạ khi có giọng)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out "public/$V"
          python3 scripts/sfx.py --events "src/videos/$V/events.json" --timing "src/videos/$V/timing.json" --out out/sfx.wav
          ffmpeg -v error -y -i "assets/$V/voice.mp3" -i out/sfx.wav -filter_complex \
            "[0:a]aresample=48000,aformat=channel_layouts=stereo,loudnorm=I=-16:TP=-2:LRA=11,asplit=2[v][vsc];[1:a]volume=0.6[s];[s][vsc]sidechaincompress=threshold=0.03:ratio=8:attack=15:release=350[sd];[v][sd]amix=inputs=2:duration=longest:normalize=0,alimiter=limit=0.89[m]" \
            -map "[m]" -c:a aac -b:a 192k "public/$V/mix.m4a"
          ffmpeg -i "public/$V/mix.m4a" -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume"

      - name: Cài Remotion
        run: npm install --no-audit --no-fund && npx tsc --noEmit

      - name: Dựng
        shell: bash
        run: |
          set -o pipefail
          C=$(python3 -c "print('$V'.capitalize())")
          npx remotion browser ensure
          npx remotion render "$C" out/video.mp4 --props="{\"video\":\"$V\",\"audio\":\"$V/mix.m4a\"}" --concurrency=2 --log=info 2>&1 | tee out/render.log
          test -s out/video.mp4
          ffmpeg -v error -y -i out/video.mp4 -vf "scale=in_range=full:out_range=tv,format=yuv420p" -c:v libx264 -preset veryfast -crf 18 -c:a copy -movflags +faststart out/final.mp4
          mv out/final.mp4 out/video.mp4

      - name: QA
        shell: bash
        run: |
          set -o pipefail
          EXP=$(python3 -c "import json,math;print(math.ceil(json.load(open('src/videos/$V/timing.json'))['duration']*30))")
          chmod +x scripts/qa.sh
          scripts/qa.sh out/video.mp4 "$EXP" 2>&1 | tee out/qa.log
          ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 out/video.mp4 | grep -q aac || { echo "FAIL không có audio"; exit 1; }
          MV=$(ffmpeg -i out/video.mp4 -af volumedetect -f null - 2>&1 | grep -o "mean_volume: [-0-9.]*" | grep -o "[-0-9.]*$")
          echo "mean_volume=$MV" | tee -a out/qa.log
          python3 -c "import sys; sys.exit(0 if float('$MV') > -35 else 1)" || { echo "FAIL audio quá nhỏ"; exit 1; }

      - name: Surface logs on failure
        if: failure()
        shell: bash
        run: |
          for f in out/render.log out/qa.log /tmp/align.txt; do
            [ -f "$f" ] || continue
            MSG=$(tail -n 50 "$f" | sed 's/\x1b\[[0-9;]*m//g' | sed 's/%/%25/g' | tr '\n' '~' | tail -c 3500 | sed 's/~/%0A/g')
            echo "::error title=$f::$MSG"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.video }}-produce
          path: |
            out/video.mp4
            out/contact_sheet.jpg
            out/qa.log
            out/render.log
          retention-days: 14

      - name: Đưa lên nhánh renders
        if: success()
        shell: bash
        run: |
          mkdir -p /tmp/pub
          cp out/video.mp4 "/tmp/pub/$V-final.mp4"; cp out/contact_sheet.jpg "/tmp/pub/$V-final-contact_sheet.jpg"; cp out/qa.log "/tmp/pub/$V-final-qa.log"
          cp "src/videos/$V/timing.json" "/tmp/pub/$V-timing.json"
          git stash -u -q || true
          git fetch origin renders --depth 1 && git checkout -B renders origin/renders
          cp /tmp/pub/* .
          git add -A && git commit -q -m "Produce $V ($GITHUB_RUN_ID)" || true
          git push origin renders
