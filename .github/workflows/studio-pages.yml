name: Trang Xưởng Duyệt Hình (GitHub Pages)

# Publishes studio/ to https://maihaianh2911-bit.github.io/geister-video-factory/
# One-time setup by the owner: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['studio/**', '.github/workflows/studio-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: studio }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: studio }
      - id: deploy
        uses: actions/deploy-pages@v4
