name: Bản thử 15 giây v43
on:
  push:
    branches: [codex/v43-quality-trial]
permissions:
  contents: read
  actions: read
jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Cài bộ dựng
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libxrandr2 libxcomposite1 libxdamage1 libxfixes3 libpango-1.0-0 libcairo2 libcups2 libasound2t64
          npm ci --no-audit --no-fund
          pip install -q pillow
          npx remotion browser ensure
      - name: Lấy video gốc và kiểm tra mã thử
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh run download 40833201566 -R "$GITHUB_REPOSITORY" -n v43-produce -D out/v43-quality/original
          python3 scripts/gen_registry.py --only v43_trial
          npm run check
          node scripts/validate_scene.mjs v43_trial
      - name: Dựng đúng 15 giây và ghép so sánh
        run: |
          node experiments/v43-quality/render.mjs
          python3 experiments/v43-quality/package.py
          ffprobe -v error -show_entries format=duration -of default=nw=1 out/v43-quality/v43-15s-comparison.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v43-quality-trial
          path: |
            out/v43-quality/v43-redesign-15s.mp4
            out/v43-quality/*-comparison.mp4
            out/v43-quality/*-comparison.jpg
            out/v43-quality/*-after.mp4
            out/v43-quality/*-motion.jpg
            out/v43-quality/v43-15s-comparison.mp4
            out/v43-quality/v43-before-after.jpg
            jobs/v43_trial/validate.json
          retention-days: 14
